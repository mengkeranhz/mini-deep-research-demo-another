spring:
  application:
    name: mini-deep-research-demo-v2
  ai:
    openai:
      api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
      # Deep research / tool-calling completions can easily exceed the Spring AI
      # OpenAI client's 60s default call timeout.
      timeout: ${LLM_TIMEOUT:600s}
      max-retries: ${LLM_MAX_RETRIES:3}
      chat:
        options:
            model: ${LLM_MODEL:${OPENAI_MODEL:glm-5.3}}
            temperature: 0.2
    anthropic:
      api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${ANTHROPIC_BASE_URL:https://open.bigmodel.cn/api/anthropic}
      timeout: ${LLM_TIMEOUT:600s}
      max-retries: ${LLM_MAX_RETRIES:3}
      chat:
        options:
            model: ${LLM_MODEL:${OPENAI_MODEL:glm-5.3}}
            max-tokens: 32768
            temperature: 0.2

research:
  llm-provider: ${LLM_PROVIDER:openai}   # openai | anthropic
  max-rounds: 25
  context-token-threshold: 24000
  tavily-api-key: ${TAVILY_API_KEY:}
  tavily-max-results: 25
  http:
    connect-timeout: ${RESEARCH_HTTP_CONNECT_TIMEOUT:10s}
    response-timeout: ${RESEARCH_HTTP_RESPONSE_TIMEOUT:30s}
    retries: ${RESEARCH_HTTP_RETRIES:2}
    proxy-host: ${RESEARCH_HTTP_PROXY_HOST:}
    proxy-port: ${RESEARCH_HTTP_PROXY_PORT:0}
  project-root: ${user.dir}
  archive-root: ${user.dir}/runs
