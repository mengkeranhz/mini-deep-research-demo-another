spring:
  application:
    name: mini-deep-research-demo-v2
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        options:
            model: ${OPENAI_MODEL:glm-5.3}
            temperature: 0.2

research:
  max-rounds: 24
  context-token-threshold: 24000
  tavily-api-key: ${TAVILY_API_KEY:}
  tavily-max-results: 5
  project-root: ${user.dir}
  archive-root: ${user.dir}/runs
